spring.application.name=Uber-End2End
server.port=${PORT:8080}
# MongoDB Configuration
# spring.mongodb.host=${MONGO_HOST:localhost}
# spring.mongodb.port=${MONGO_PORT:27017}
# spring.mongodb.database=${MONGO_DB:uberdb}
# MySQL Configuration (added SSL and timezone parameters)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:uberdb}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Grpc Ports
grpc.server.port=9090
grpc.server.host=localhost

grpc.client.port=9091
grpc.client.host=localhost

# CRITICAL: Disable banner and default console logging
# If you don't do this, the AI Client will crash trying to read the startup banner as JSON.
spring.main.banner-mode=off
# application.properties
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# # Lets the port be reused immediately on restart
# server.tomcat.additional-tld-skip-patterns=*.jar
spring.ai.mcp.server.sse-endpoint=/sse